<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRA - Acceso y Registro</title>

    <!-- Icono de pestaña -->
    <link rel="icon" href="logo-sira.jpeg" type="image/jpeg">

    <style>
        /* ===========================
           CONFIGURACIÓN GENERAL
        =========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #FFB7D5 0%,
                #B79DFF 30%,
                #6FD9FF 65%,
                #8EF7C8 100%
            );
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::after {
            content: "";
            position: fixed;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            bottom: -180px;
            left: -120px;
            filter: blur(100px);
            z-index: -1;
        }

        /* ===========================
                MENÚ / NAVBAR
        =========================== */
        .navbar {
            width: 100%;
            height: 80px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #5B4EE5;
        }

        .logo-header {
            height: 80px;
            width: auto;
            object-fit: contain;
        }

        .logo span {
            font-size: 50px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav ul li a {
            text-decoration: none;
            color: #444;
            font-size: 18px;
            transition: .3s;
        }

        nav ul li a:hover {
            color: #5B4EE5;
        }

        .login-btn-header {
            background: #5B4EE5;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: .3s;
        }

        .login-btn-header:hover {
            background: #4435d6;
        }

        /* ===========================
           ESTILOS DE AUTENTICACIÓN
        =========================== */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 45px 40px;
        }

        /* Pestañas de navegación para separar Login y Registro */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            padding: 6px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: #5145CD;
            color: white;
            box-shadow: 0 4px 12px rgba(81, 69, 205, 0.25);
        }

        /* Control de visualización de formularios */
        .auth-form {
            display: none;
            flex-direction: column;
        }

        .auth-form.active-form {
            display: flex;
        }

        .auth-form h2 {
            color: #5145CD;
            font-size: 32px;
            text-align: center;
        }

        .auth-subtitle {
            color: #555;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 22px;
        }

        /* Campos de Entrada */
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 15px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group select {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #5145CD;
            box-shadow: 0 0 10px rgba(81, 69, 205, 0.25);
            background: #fff;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .forgot-pass {
            color: #5145CD;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        /* Botón Principal */
        .btn-primary {
            background: #5145CD;
            color: white;
            padding: 16px;
            border-radius: 15px;
            border: none;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            width: 100%;
        }

        .btn-primary:hover {
            background: #4435d6;
        }

        .switch-form-text {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 15px;
        }

        .switch-form-text a {
            color: #5145CD;
            font-weight: bold;
            text-decoration: none;
        }

        .switch-form-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- MENÚ / NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="logo-sira.jpeg" alt="Logo SIRA" class="logo-header">
            <span>SIRA</span>
        </div>

        <nav>
            <ul>
                <li><a href="index_1.html">Inicio</a></li>
                <li><a href="index_1.html">Nosotros</a></li>
                <li><a href="index_1.html">Recursos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>

        <a href="index_1.html" class="login-btn-header">
            Volver
        </a>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="auth-container">
        <div class="auth-card">

            <!-- Pestañas para cambiar entre Login y Registro -->
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Registrarse</button>
            </div>

            <!-- ===========================
                 FORMULARIO 1: INICAR SESIÓN
            =========================== -->
            <form id="form-login" class="auth-form active-form" onsubmit="event.preventDefault();">
                <h2>¡Bienvenido!</h2>
                <p class="auth-subtitle">Ingresa tus datos para acceder a tu cuenta en SIRA.</p>

                <div class="input-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>

                <p class="switch-form-text">
                    ¿No tienes una cuenta? <a href="#" onclick="switchTab('register')">Regístrate aquí</a>
                </p>
            </form>

            <!-- ===========================
                 FORMULARIO 2: REGISTRO
            =========================== -->
            <form id="form-register" class="auth-form" onsubmit="event.preventDefault();">
                <h2>Crea tu cuenta</h2>
                <p class="auth-subtitle">Únete a nuestra plataforma interactiva e inclusiva.</p>

                <div class="input-group">
                    <label for="reg-name">Nombre Completo</label>
                    <input type="text" id="reg-name" placeholder="Tu nombre y apellido" required>
                </div>

                <div class="input-group">
                    <label for="reg-role">Perfil del usuario</label>
                    <select id="reg-role" required>
                        <option value="" disabled selected>Selecciona tu rol</option>
                        <option value="estudiante">Estudiante</option>
                        <option value="tutor">Padre o Tutor</option>
                        <option value="docente">Docente / Educador</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <button type="submit" class="btn-primary">Crear Cuenta</button>

                <p class="switch-form-text">
                    ¿Ya tienes cuenta? <a href="#" onclick="switchTab('login')">Inicia sesión</a>
                </p>
            </form>

        </div>
    </main>

    <!-- JAVASCRIPT: Lógica de alternancia entre pantallas -->
    <script>
        function switchTab(screen) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (screen === 'login') {
                // Muestra Login y oculta Registro
                loginForm.classList.add('active-form');
                registerForm.classList.remove('active-form');

                // Cambia el estado visual de los botones superiores
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                // Muestra Registro y oculta Login
                registerForm.classList.add('active-form');
                loginForm.classList.remove('active-form');

                // Cambia el estado visual de los botones superiores
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }
    </script>

</body>
</html>
